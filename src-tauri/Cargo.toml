[package]
name = "krust"
version = "0.1.0"
description = "A Rust (Tauri + WebView2) client for Krunker.io"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"

# Same versions Tauri's WebView2 backend (wry) uses, for request interception.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
