# Builds, signs and publishes a release when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The result is a DRAFT release. Review it, then click "Publish release":
# users' auto-updaters only see published releases.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write      # create the draft release and upload assets
      id-token: write      # Sigstore signing for the provenance attestation
      attestations: write  # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag, version and update key
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = $env:TAG
          if ($tag -ne "v$($conf.version)") {
            throw "Tag $tag does not match version $($conf.version) in tauri.conf.json"
          }
          if (-not $conf.plugins.updater.pubkey) {
            throw "plugins.updater.pubkey is empty: this build could never verify updates"
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build, sign updater bundle and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Krust ${{ github.ref_name }}
          releaseBody: |
            Download **Krust_*_x64-setup.exe** below and run it. No admin rights needed.
            Already installed? Krust offers this update automatically.

            Verify your download: see [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md#verifying-a-download).
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config {"bundle":{"createUpdaterArtifacts":true}}

      - name: Checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          Set-Location src-tauri/target/release/bundle/nsis
          Get-ChildItem *-setup.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          gh release upload $env:TAG SHA256SUMS.txt --repo $env:REPO --clobber

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*-setup.exe
